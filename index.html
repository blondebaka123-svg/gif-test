<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky or Not</title>
<meta name="description" content="One tap. Are you lucky or not?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14233a;          /* neutral: midnight blue */
    --ink: #fff7e0;
    --gold: #ffc531;
    --gold-deep: #c98a00;
    --card: #fff7e0;
    --card-ink: #14233a;
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    overflow: hidden;
    transition: background 0.8s ease;
  }
  body.lucky   { --bg: #ff8a3d; --card-ink: #7a2d00; }
  body.unlucky { --bg: #2b303b; --card-ink: #2b303b; }

  main {
    position: relative;
    z-index: 2;
    width: min(92vw, 28rem);
    text-align: center;
    padding: 1.5rem 0;
  }
  h1 {
    margin: 0 0 0.25rem;
    font-size: clamp(2.4rem, 9vw, 3.6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .sub { margin: 0 0 2rem; opacity: 0.8; font-size: 1.05rem; }

  /* The coin button is the one memorable element */
  .coin {
    appearance: none;
    border: 0;
    cursor: pointer;
    width: clamp(10rem, 52vw, 12.5rem);
    aspect-ratio: 1;
    border-radius: 50%;
    font: 800 1.35rem/1.1 var(--font);
    color: #5a3b00;
    background: radial-gradient(circle at 32% 28%, #ffe48a, var(--gold) 55%, var(--gold-deep));
    box-shadow: inset 0 0 0 0.5rem rgba(255,255,255,0.25),
                inset 0 0 0 0.65rem rgba(90,59,0,0.25),
                0 1rem 2rem rgba(0,0,0,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .coin:hover  { transform: scale(1.04); }
  .coin:active { transform: scale(0.97); }
  .coin:focus-visible { outline: 4px solid var(--ink); outline-offset: 6px; }
  .coin:disabled { cursor: progress; }
  .coin.flipping { animation: flip 1.1s ease-in-out; }
  @keyframes flip {
    0%   { transform: rotateY(0) translateY(0); }
    50%  { transform: rotateY(900deg) translateY(-2.5rem); }
    100% { transform: rotateY(1800deg) translateY(0); }
  }

  .result {
    margin: 2rem auto 0;
    min-height: 9rem;
  }
  .card {
    display: none;
    background: var(--card);
    color: var(--card-ink);
    border-radius: 1.25rem;
    padding: 1.4rem 1.5rem;
    box-shadow: 0 1rem 2.5rem rgba(0,0,0,0.3);
  }
  .card.show { display: block; animation: pop 0.45s cubic-bezier(.2,1.4,.4,1); }
  .card strong {
    display: block;
    font-size: clamp(2.6rem, 12vw, 4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .card span { display: block; margin-top: 0.5rem; font-weight: 500; }
  #unluckyCard { transform-origin: top center; }
  #unluckyCard.show { animation: droop 0.7s ease-out; }
  @keyframes pop   { from { transform: scale(0.6) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes droop { from { transform: translateY(-1.5rem); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Rain layer (unlucky) */
  #rain {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none; overflow: hidden;
    opacity: 0; transition: opacity 0.6s ease;
  }
  body.unlucky #rain { opacity: 1; }
  .drop {
    position: absolute; top: -10vh;
    width: 2px; height: 3.2rem;
    background: linear-gradient(to bottom, transparent, rgba(180,205,255,0.75));
    border-radius: 2px;
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translateY(120vh); } }

  @media (prefers-reduced-motion: reduce) {
    .coin.flipping, .card.show, #unluckyCard.show { animation: none; }
    .drop { animation-duration: 6s !important; }
  }
</style>
</head>
<body>
  <div id="rain" aria-hidden="true"></div>

  <main>
    <h1>Lucky or Not?</h1>
    <p class="sub">Flip the coin and find out.</p>

    <button class="coin" id="coin" type="button">Test your luck!</button>

    <div class="result" aria-live="polite">
      <div class="card" id="luckyCard">
        <strong>LUCKY!</strong><span>Today is your day. Go for it.</span>
      </div>
      <div class="card" id="unluckyCard">
        <strong>UNLUCKY!</strong><span>Not this time. Try again?</span>
      </div>
    </div>
  </main>

  <!-- canvas-confetti via CDN (the app still works if this fails to load) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
  <script>
  /* ================= CONFIG ================= */
  const LUCKY_CHANCE = 0.5;   // 0.5 = 50/50. Try 0.8 for 80% lucky, 0.1 for 10%.

  /* ---- Custom audio: paste links to your own .mp3 files here ----
     Leave as "" to use the built-in synthesized sounds (no files needed).
     Examples:  lucky: "sounds/win.mp3"   or   "https://example.com/win.mp3"
                unlucky: "sounds/sad-violin.mp3"                                  */
  const CUSTOM_SOUNDS = {
    lucky: "",     // <-- swap in your cheerful victory .mp3 here
    unlucky: ""    // <-- swap in your sad violin .mp3 here
  };

  /* ================= ELEMENTS ================= */
  const coin = document.getElementById("coin");
  const luckyCard = document.getElementById("luckyCard");
  const unluckyCard = document.getElementById("unluckyCard");
  const rain = document.getElementById("rain");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= AUDIO ================= */
  let ctx;
  function audioCtx() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  let currentFile;
  function stopSounds() {
    if (currentFile) { currentFile.pause(); currentFile = null; }
  }

  // Cheerful chime: rising major arpeggio with a bell-like tail
  function synthLucky() {
    const ac = audioCtx(), t0 = ac.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle"; o.frequency.value = f;
      const t = t0 + i * 0.11;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + 0.95);
    });
  }

  // Sad violin: slow descending notes, sawtooth + vibrato + low-pass filter
  function synthUnlucky() {
    const ac = audioCtx(), t0 = ac.currentTime;
    [[392.0, 0.9], [369.99, 0.9], [329.63, 0.9], [293.66, 1.8]].reduce((start, [f, dur]) => {
      const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
      const lfo = ac.createOscillator(), lfoGain = ac.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f * 1.02, start);          // slide into the note
      o.frequency.exponentialRampToValueAtTime(f, start + 0.12);
      lp.type = "lowpass"; lp.frequency.value = 1400; lp.Q.value = 2;
      lfo.frequency.value = 5.5; lfoGain.gain.value = f * 0.012; // vibrato
      lfo.connect(lfoGain).connect(o.frequency);
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.16, start + 0.25);
      g.gain.setValueAtTime(0.16, start + dur - 0.2);
      g.gain.linearRampToValueAtTime(0.0001, start + dur + 0.15);
      o.connect(lp).connect(g).connect(ac.destination);
      o.start(start); lfo.start(start);
      o.stop(start + dur + 0.2); lfo.stop(start + dur + 0.2);
      return start + dur * 0.95;
    }, t0);
  }

  function playSound(kind) {
    stopSounds();
    const url = CUSTOM_SOUNDS[kind];
    if (url) {
      const a = new Audio(url);
      currentFile = a;
      // If your file can't load or play, fall back to the synthesized sound
      a.play().catch(() => (kind === "lucky" ? synthLucky() : synthUnlucky()));
      return;
    }
    kind === "lucky" ? synthLucky() : synthUnlucky();
  }

  /* ================= EFFECTS ================= */
  function confettiShower() {
    if (typeof confetti !== "function") return;
    const opts = { disableForReducedMotion: true, zIndex: 5 };
    confetti({ ...opts, particleCount: 120, spread: 80, origin: { y: 0.6 } });
    const end = Date.now() + 1800;
    (function frame() {
      confetti({ ...opts, particleCount: 4, angle: 60,  spread: 60, origin: { x: 0 } });
      confetti({ ...opts, particleCount: 4, angle: 120, spread: 60, origin: { x: 1 } });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  function buildRain() {
    for (let i = 0; i < 70; i++) {
      const d = document.createElement("div");
      d.className = "drop";
      d.style.left = Math.random() * 100 + "vw";
      d.style.animationDuration = 0.7 + Math.random() * 0.7 + "s";
      d.style.animationDelay = -Math.random() * 1.5 + "s";
      d.style.opacity = 0.35 + Math.random() * 0.5;
      rain.appendChild(d);
    }
  }
  buildRain();

  /* ================= GAME ================= */
  function reset() {
    document.body.classList.remove("lucky", "unlucky");
    luckyCard.classList.remove("show");
    unluckyCard.classList.remove("show");
    if (typeof confetti === "function" && confetti.reset) confetti.reset();
  }

  coin.addEventListener("click", () => {
    audioCtx();                         // unlock audio on the user's tap (needed on mobile)
    reset();
    coin.disabled = true;
    coin.textContent = "...";
    coin.classList.add("flipping");

    setTimeout(() => {
      coin.classList.remove("flipping");
      coin.disabled = false;
      coin.textContent = "Try again";

      const isLucky = Math.random() < LUCKY_CHANCE;
      document.body.classList.add(isLucky ? "lucky" : "unlucky");
      (isLucky ? luckyCard : unluckyCard).classList.add("show");
      if (isLucky) confettiShower();
      playSound(isLucky ? "lucky" : "unlucky");
    }, reduceMotion ? 200 : 1100);
  });
  </script>
</body>
</html>
