<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lucky?</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    background:#000;
    color:#fff;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Courier New', ui-monospace, monospace;
    text-align:center;
    overflow:hidden;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:scale(0.96); }
    to{ opacity:1; transform:scale(1); }
  }
  @media (min-width:700px){
    #result{ font-size:90px; }
  }
</style>
</head>
<script>
  const lucky = Math.random() < 0.5;
  document.getElementById('result').textContent = lucky ? 'YOU ARE LUCKY' : 'NOT LUCKY';
</script>
</body>
</html>
